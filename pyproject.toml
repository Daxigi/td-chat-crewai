[project]
name = "td_chat"
version = "0.1.0"
description = "td-chat using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.177.0,<1.0.0"
]

[project.scripts]
td_chat = "td_chat.main:run"
run_crew = "td_chat.main:run"
train = "td_chat.main:train"
replay = "td_chat.main:replay"
test = "td_chat.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
