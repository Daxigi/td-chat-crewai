process_request_task:
  description: >
    Tu objetivo es analizar la PREGUNTA MÁS RECIENTE del usuario: '{user_question}'.
    Usa el historial de chat previo solo como contexto, pero tu foco principal debe ser
    responder a la última petición del usuario.

    <historial_chat>
    {chat_history}
    </historial_chat>

    Pasos a seguir:
    1. Si la última pregunta es una solicitud de reporte y tienes todos los datos
       (fechas, DNI, etc.), usa la herramienta apropiada para obtener la respuesta.
    2. Si es una solicitud de reporte pero faltan datos, pregunta al usuario amablemente
       por la información que necesitas. (Ej: "Para ese reporte, ¿podrías darme tu DNI?").
    3. Si el usuario está saludando, o preguntando de forma general qué puedes hacer,
       describe tus capacidades de forma amigable (para esto, usa la herramienta 'list_available_reports').
  expected_output: >
    Una respuesta útil y directa a la última pregunta del usuario, ya sea el resultado
    de un reporte, una pregunta para aclarar dudas, o un resumen de tus capacidades.
  agent: report_assistant