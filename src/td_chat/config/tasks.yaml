process_request_task:
  description: >
    Analiza la pregunta del usuario: '{user_question}'.
    1. Interpreta la pregunta para identificar el reporte solicitado y sus parámetros (fechas, IDs, etc.).
    2. Selecciona y utiliza la herramienta apropiada para obtener los datos.
    3. Formula una respuesta amigable para el usuario. Si obtuviste datos, preséntalos de forma legible.
       Si la solicitud es ambigua, pide una clarificación cortésmente.
  expected_output: >
    Un string de texto con la respuesta final para el usuario.
  agent: report_assistant