process_request_task:
  description: >
    Procesa la pregunta del usuario: '{user_question}'.

    Contexto de conversación disponible:
    <context>
    {chat_history}
    </context>

    IMPORTANTE: El historial está ordenado cronológicamente. Los mensajes más recientes están al final
    y deben priorizarse, ya que el usuario probablemente está haciendo seguimiento basado en ellos.

    Flujo de trabajo:
    1. Si la pregunta del usuario es "qué preguntas puedes responder?", DEBES usar la herramienta `list_available_reports` para obtener una lista de los trámites y reportes disponibles y presentarla al usuario.
    2. Analiza el tipo de solicitud (saludo, consulta de trámite/reporte, o fuera de alcance).
    3. Si se requiere información adicional o clarificación, solicítala al usuario.
    3. Ejecuta las herramientas necesarias para obtener los datos requeridos.
    4. Formula una respuesta clara con los resultados obtenidos.
  expected_output: >
    Un string de texto con la respuesta final para el usuario.
  agent: report_assistant