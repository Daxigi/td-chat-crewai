analizar_peticion_task:
  description: >
    Analiza la pregunta del usuario, que es: '{user_question}'.
    Tu objetivo es interpretar esta pregunta, identificar qué reporte se está
    solicitando y extraer cualquier parámetro relevante (como fechas, IDs, etc.).
    Luego, selecciona y utiliza la herramienta más apropiada para cumplir con la solicitud.
  expected_output: >
    La salida cruda y directa de la herramienta que utilizaste. Puede ser un
    string en formato JSON con los datos del reporte, una lista de los reportes
    disponibles, o un mensaje de error si la solicitud no pudo ser procesada.
    No formatees ni alteres este resultado.
  agent: analista_de_peticiones

formular_respuesta_task:
  description: >
    Toma el contexto recibido de la tarea anterior (que es la salida cruda de una herramienta)
    y transfórmalo en una respuesta final, clara y amigable para el usuario.
    Si el contexto contiene datos JSON, preséntalos de manera legible.
    Si es una lista de reportes, formatéala de forma ordenada.
    Si es un error, explica el problema de manera cortés y ofrece ayuda.
  expected_output: >
    Un único string de texto que sea la respuesta final y completa para ser
    mostrada al usuario en el chat.
  agent: formulador_de_respuestas